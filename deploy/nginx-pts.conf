# PTS - Nginx yapilandirmasi
#
# Bu dosyayi aaPanel'in ana site konfigurasyonuna yapistirma. aaPanel her
# site icin bir eklenti dizini include eder:
#
#   include /www/server/panel/vhost/nginx/extension/<alan-adi>/*.conf;
#
# Dosyayi o dizine kopyalarsak aaPanel ana konfigurasyonu yeniden urettiginde
# (SSL yenileme, ayar degisikligi) ayarlarimiz silinmez:
#
#   cp deploy/nginx-pts.conf \
#      /www/server/panel/vhost/nginx/extension/pts.ernsaha.com.tr/pts.conf
#   nginx -t && nginx -s reload

# --- API: Rust backend (Docker, 127.0.0.1:8080) ---
location /api/ {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Kiosk saniyede birden cok kez okuma bildirebiliyor; kisa timeout yeterli.
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}

location = /health {
    proxy_pass http://127.0.0.1:8080/health;
    access_log off;
}

# --- Frontend: React SPA ---
# ^~ kullaniyoruz: aaPanel statik dosyalar icin regex location tanimlar ve
# regex, normal prefix eslesmesini gecersiz kilar. ^~ bunu engeller.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# js-aruco2 dosyalari surumle degismedigi icin cache'lenir ama immutable degil.
location ^~ /vendor/ {
    expires 7d;
}

# index.html her zaman tazeden okunmali. Icindeki script etiketi hash'li
# dosya adina isaret ediyor; kabuk onbellekten gelirse yeni surum yayina
# alindiktan sonra tarayici eski paketi istemeye devam eder.
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}

# React Router client-side yonlendirme kullaniyor: bilinmeyen yollar
# index.html'e dusmeli, yoksa /puantaj yenilendiginde 404 alinir.
location / {
    try_files $uri $uri/ /index.html;
}
