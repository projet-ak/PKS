# aaPanel > Web Sitesi > pts.ernsaha.com.tr > Konfigurasyon
# Bu blogu, aaPanel'in olusturdugu SSL server blogunun ICINE ekle.
# SSL ve sertifika satirlarina dokunma; aaPanel onlari kendisi yonetir.

# --- API: Rust backend (Docker, 127.0.0.1:8080) ---
location /api/ {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Kiosk saniyede birden cok kez okuma bildirebiliyor; kisa timeout yeterli.
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}

location = /health {
    proxy_pass http://127.0.0.1:8080/health;
    access_log off;
}

# --- Frontend: React SPA ---
# Statik varliklar hash'li isimlerle uretiliyor, uzun sureli cache guvenli.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# js-aruco2 dosyalari surumle degismedigi icin cache'lenir ama immutable degil.
location /vendor/ {
    expires 7d;
}

# React Router client-side yonlendirme kullaniyor: bilinmeyen yollar
# index.html'e dusmeli, yoksa /puantaj yenilendiginde 404 alinir.
location / {
    try_files $uri $uri/ /index.html;
}
