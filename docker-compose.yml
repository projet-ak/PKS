services:
  db:
    image: postgres:17-alpine
    container_name: pks-db
    environment:
      POSTGRES_USER: pks
      POSTGRES_PASSWORD: pks
      POSTGRES_DB: pks
    ports:
      - "5432:5432"
    volumes:
      - pks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pks-pgdata:
